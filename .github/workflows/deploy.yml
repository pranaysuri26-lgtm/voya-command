name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway deployment via API
        run: |
          curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation redeploy($serviceId: String!, $environmentId: String!) { serviceInstanceRedeploy(serviceId: $serviceId, environmentId: $environmentId) }",
              "variables": {
                "serviceId": "13cc33b1-7b9d-4f64-9f37-267538041cfa",
                "environmentId": "645fab30-6227-456d-976a-88a2f7c9f782"
              }
            }' | tee /tmp/response.json
          cat /tmp/response.json
          if grep -q '"errors"' /tmp/response.json; then
            echo "Railway API returned errors"
            exit 1
          fi
          echo "Deployment triggered successfully"
